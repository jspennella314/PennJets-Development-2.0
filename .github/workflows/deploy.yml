name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  # Rebuild daily so new Market Notes get their static preview pages within a day.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        # 20, not 18, because playwright declares engines >= 20 and its CLI
        # refuses to run below that. npm ci does not enforce engines, so the
        # install succeeded and the browser install failed instead, which took
        # the deploy down on 2026-09-21 without touching the site's own code.
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # The build's prerender stage renders every route in this browser.
    #
    # continue-on-error, deliberately. A browser download is infrastructure,
    # not this site's content, and a deploy should never be hostage to it. If
    # this step fails the build still runs: scripts/prerender.mjs cannot launch
    # Chromium, says so loudly, and leaves every route with the head
    # postbuild.mjs wrote, which is exactly what production served before
    # WO-4.23. A content problem still fails the build; only a missing browser
    # degrades. WO-4.23.
    - name: Install Chromium for the prerender stage
      continue-on-error: true
      run: npx playwright install --with-deps chromium

    - name: Build
      run: npm run build
      env:
        VITE_CRM_API_URL: https://www.pennforce.pennjets.com
        VITE_CONTACT_WEBHOOK_ID: cmi7ljjn50001vsesrk6f58p6
        VITE_WEBHOOK_JOE_PENNELLA: cmi7ljjow0003vsesltpym6s3

    - name: Copy CNAME file
      run: cp public/CNAME dist/CNAME

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        cname: www.pennjets.com