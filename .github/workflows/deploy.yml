name: Deploy to GitHub Pages

# The Actions list says why a run happened. A dispatch from the CRM reads
# "market-notes: published <slug>"; everything else keeps the workflow's name.
# WO-4.45.
run-name: "${{ github.event_name == 'repository_dispatch' && format('market-notes: {0} {1}', github.event.client_payload.reason, github.event.client_payload.slug) || 'Deploy to GitHub Pages' }}"

on:
  push:
    branches: [ main ]
  # Rebuild daily so new Market Notes get their static preview pages within a
  # day. This stays as the safety net under the dispatch below. WO-4.45.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  # The CRM posts a repository_dispatch when a Market Note is published or
  # edited (T1's WO-1.31), with client_payload { reason, slug, at }. The job
  # does not read the payload: it rebuilds from the CRM as on any other run,
  # and the new note is in the build because the build ran. WO-4.45.
  repository_dispatch:
    types: [market-notes]

# One build at a time, the latest wins: five edits in two minutes end as one
# finished deploy, and the 06:00 run never overlaps a dispatched one. A
# cancelled run cannot leave Pages half-deployed: the deploy step is one git
# push of a complete gh-pages commit (peaceiris/actions-gh-pages), so a run
# cancelled before it leaves the previous deploy in place and one cancelled
# during it either lands whole or not at all. WO-4.45.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    # ubuntu-24.04, not ubuntu-latest. The "latest" label moves to a new
    # image on 19 October 2026 and every job on it follows without being
    # asked; WO-4.26 was exactly that shape, a runner changing under a build.
    # This is the image the label resolved to on the last green run before
    # the pin (run 35718872977, "Set up job": Image: ubuntu-24.04, Version:
    # 20260907.300.1). It now changes only when someone changes it. WO-4.28.
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      # v7 declares runs.using: node24. v4 declared node20, which the runner
      # has been forcing onto Node 24 with a deprecation line on every run
      # since the 2025-09-19 changelog. WO-4.28.
      uses: actions/checkout@v7

    - name: Setup Node.js
      # v7 declares runs.using: node24, same reason as checkout. Its v5
      # auto-cache only triggers on a package.json "packageManager" field,
      # which this project does not have; cache: npm below is unchanged.
      # WO-4.28.
      uses: actions/setup-node@v7
      with:
        # 22, not 18. playwright 1.63 declares engines >= 20 and its CLI
        # refuses to run below that, so npm ci installed it cleanly and the
        # browser install failed 21 seconds in, taking the deploy down on
        # 2026-09-21 without touching a line of the site's own code.
        #
        # 22 rather than the minimum 20 because 22 is what this project is
        # built and evidenced on locally. The bug was not the floor itself, it
        # was a runner running something different from where the work was
        # checked; matching them removes that whole class of failure rather
        # than clearing this one instance of it. WO-4.26.
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # The build's prerender stage renders every route in this browser and
    # writes the result into dist. Without it the build fails. WO-4.23.
    # The NoteBody test below drives the same browser, so this comes first.
    - name: Install Chromium for the prerender stage
      run: npx playwright install --with-deps chromium

    # The site's tests (vitest, vitest.config.js) run before anything is
    # built: a failing test stops the deploy here. WO-4.41 placed this step
    # after the Chromium install rather than before it because the NoteBody
    # sanitiser test renders in that Chromium (DOMPurify is inert under
    # happy-dom; see NoteBody.test.js).
    - name: Test
      run: npm test

    - name: Build
      run: npm run build
      env:
        VITE_CRM_API_URL: https://www.pennforce.pennjets.com
        VITE_CONTACT_WEBHOOK_ID: cmi7ljjn50001vsesrk6f58p6
        VITE_WEBHOOK_JOE_PENNELLA: cmi7ljjow0003vsesltpym6s3

    - name: Copy CNAME file
      run: cp public/CNAME dist/CNAME

    - name: Deploy to GitHub Pages
      # v4 declares runs.using: node24. v3 declared node16, two runtimes
      # behind the runner's default. Inputs are unchanged between them. WO-4.28.
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        cname: www.pennjets.com