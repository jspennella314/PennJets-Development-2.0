<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PennJets - Premier aviation brokerage services. Find and sell private jets, aircraft management, and charter services." />
    <!-- keywords and author are set per route by Helmet, in PageMeta and, for a
         Market Note, in BlogArticle. They were static here as well, so a note
         page served two of each and they disagreed. WO-4.23. Google has not
         used the keywords meta for ranking since 2009; nothing replaced it. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://www.pennforce.pennjets.com">
    <title>Penn Jets | Private Jet Brokerage &amp; Aviation Consulting</title>

    <!-- A reader who dismissed this year's countdown banner never sees the
         prerendered one flash: the class hides it and docks the header at 0
         (src/index.css) before the app mounts. The key is Header.jsx's.
         The two chrome heights the prerender measured at desktop width are
         dropped too, so the first paint uses the stylesheet's per-width
         values and a phone does not see the header move when the app
         measures. WO-4.49. -->
    <script>
      try {
        document.documentElement.style.removeProperty('--pj-banner-h');
        document.documentElement.style.removeProperty('--pj-header-h');
        if (localStorage.getItem('pj.banner.' + new Date().getFullYear() + '.dismissed') === '1') {
          document.documentElement.classList.add('pj-banner-dismissed');
        }
      } catch (e) {}
    </script>

    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string,
      // converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <!-- End Single Page Apps for GitHub Pages -->

    <!-- Google Ads tag, AW-18544502023 (WO-4.56; the cookie and privacy
         policies describe it). After the WO-4.49 chrome script, so first
         paint is unchanged, and after the SPA redirect above, so a deep link
         is counted at its real address rather than GitHub's /?/ form.
         Conversions are sent from src/content/googleAds.js only.
         allow_ad_personalization_signals false: no remarketing audience is
         built from this site. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18544502023"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-18544502023', { allow_ad_personalization_signals: false });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
